[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
# Applied in :shared. Needs Sentry Cocoa installed in Xcode via SPM, or the iOS link fails.
sentryKmp = { id = "io.sentry.kotlin.multiplatform.gradle", version.ref = "sentry" }
# Applied in :shared, the module that produces the iOS framework.
skie = { id = "co.touchlab.skie", version.ref = "skie" }
sentryAndroid = { id = "io.sentry.android.gradle", version.ref = "sentryAndroidGradle" }
