[versions]
# The app's own marketing version. Single-sourced here because it is not just a build number: Sentry
# groups crashes by it, so Android and iOS reporting the same string is what makes "did this release
# regress?" answerable. iosApp/Configuration/Config.xcconfig carries MARKETING_VERSION and must be kept
# in step — xcconfig cannot read the version catalog.
tanuki = "1.0"
agp = "9.1.1"
android-compileSdk = "36"
android-minSdk = "36"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-appcompat = "1.7.1"
androidx-core = "1.19.0"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.11.0-beta01"
# Replaces the deprecated Compose `ui-backhandler`: androidx.navigationevent is where predictive-back
# moved, and Compose Multiplatform 1.11 already provides its dispatcher owner on every target.
androidx-navigationevent = "1.1.1"
androidx-testExt = "1.3.0"
composeMultiplatform = "1.11.1"
junit = "4.13.2"
kotlin = "2.4.20"
material3 = "1.11.0-alpha07"
# Material Icons (Rounded) for Android screens. 1.7.3 is the last JetBrains published; the icon set is frozen.
composeMaterialIcons = "1.7.3"
coroutines = "1.11.0"
ktor = "3.5.1"
datetime = "0.8.0"
metro = "1.4.5"
navigationCompose = "2.9.2"
kotlinxSerialization = "1.11.0"
room = "2.8.4"
sqlite = "2.7.0"
ksp = "2.3.10"
# okio — file IO for the on-disk source-bundle store. 3.14+ ships the kotlin.time.Clock-based
# FakeFileSystem needed for tests on kotlinx-datetime 0.7.x.
okio = "3.18.0"
# Chicory — pure-JVM WebAssembly interpreter (zero native deps); the Android-side WASM engine.
chicory = "1.7.5"
# Coil 3 — Compose Multiplatform image loading (covers). Network layer via its Ktor 3 integration so
# the same fetch stack works on Android and iOS.
coil = "3.5.0"
# SKIE — Swift-friendly framework API (Flow → AsyncSequence, sealed → enum, suspend → async) for the
# native SwiftUI iOS app. Must support the Kotlin version above; check its changelog on every Kotlin bump.
skie = "0.10.15"
# DataStore — multiplatform key-value preference store (theme + other app-level scalars). The
# `-core` artifact is engine-agnostic and backs onto okio, so the same store works on Android and iOS.
datastore = "1.1.7"
# Telephoto — the multiplatform `zoomable` gesture module only (pinch/pan/double-tap + pager/scroll
# arbitration). Its higher-level `zoomable-image*`/`ZoomableAsyncImage` drop-ins publish Android-only
# variants, so we attach `Modifier.zoomable()` to our own Coil `AsyncImage` to keep iOS building.
telephoto = "0.19.0"
# WorkManager — Android's background scheduler for the periodic library chapter check. Android-only by
# nature; iOS uses BGTaskScheduler behind the same `LibraryUpdateScheduler` interface.
androidx-work = "2.10.0"
# Sentry KMP — opt-in crash reporting behind the `CrashReporter` seam in :core:domain. Still pre-1.0, so
# pin it exactly and re-read the release notes before bumping. On iOS the plugin links Sentry Cocoa, which
# must already be installed in Xcode via SPM *before* Gradle runs; it resolves the xcframework out of
# DerivedData, so CI needs `sentryKmp { linker { frameworkPath } }` pinned (getsentry/…-multiplatform#484).
sentry = "0.27.0"
# Sentry Android Gradle plugin — R8 mapping upload for :androidApp. Its SDK auto-install is turned off, so
# the SDK version is still whatever the KMP SDK above brings; this only versions the build tooling.
sentryAndroidGradle = "6.23.0"

