#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Share the wasmi cinterop (core:source) bindings across the iOS targets' hierarchical source sets
# (appleMain/iosMain) instead of duplicating them per target. Recommended when a cinterop is used in a
# hierarchical KMP structure; silences the "CInterop Commonization Disabled" warning.
kotlin.mpp.enableCInteropCommonization=true